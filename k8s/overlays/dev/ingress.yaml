apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: splitwise-household-expenses-dev
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: splitwise-household-expenses-dev.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: splitwise-export
                port:
                  number: 80
