apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitwise-export
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: splitwise-export
  template:
    metadata:
      labels:
        app.kubernetes.io/name: splitwise-export
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: ghcr.io/yarinago/splitwise-household-expenses:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: APP_MODE
              value: "web"
            - name: PORT
              value: "8080"
            - name: SPLITWISE_SNAPSHOT_BACKEND
              value: "direct"
            - name: SPLITWISE_LOAD_DOTENV
              value: "0"
            - name: EXPORT_VERSION
              value: latest
          envFrom:
            - configMapRef:
                name: splitwise-export-config
            - secretRef:
                name: splitwise-export-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
