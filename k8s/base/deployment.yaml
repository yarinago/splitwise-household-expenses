apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitwise-export
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: splitwise-export
  template:
    metadata:
      labels:
        app.kubernetes.io/name: splitwise-export
        app.kubernetes.io/component: runtime
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: read-model
          emptyDir: {}
      containers:
        - name: web
          image: ghcr.io/yarinago/splitwise-household-expenses:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_MODE
              value: "web"
            - name: PORT
              value: "8080"
            - name: SPLITWISE_SNAPSHOT_BACKEND
              value: read_model
            - name: SPLITWISE_READ_MODEL_DB
              value: /data/splitwise-read-model.db
            - name: SPLITWISE_LOAD_DOTENV
              value: "0"
            - name: EXPORT_VERSION
              value: latest
          envFrom:
            - configMapRef:
                name: splitwise-export-config
            - secretRef:
                name: splitwise-export-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: read-model
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: consumer
          image: ghcr.io/yarinago/splitwise-household-expenses:latest
          imagePullPolicy: Always
          ports:
            - name: con-metrics
              containerPort: 9090
          env:
            - name: APP_MODE
              value: consumer
            - name: METRICS_PORT
              value: "9090"
            - name: SPLITWISE_READ_MODEL_DB
              value: /data/splitwise-read-model.db
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: splitwise-kafka-kafka-bootstrap:9092
            - name: KAFKA_TOPIC
              value: splitwise.expenses.v1
            - name: KAFKA_GROUP_ID
              value: splitwise-dashboard-materializer
            - name: KAFKA_AUTO_OFFSET_RESET
              value: earliest
            - name: SPLITWISE_LOAD_DOTENV
              value: "0"
          envFrom:
            - configMapRef:
                name: splitwise-export-config
            - secretRef:
                name: splitwise-export-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: read-model
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
