name: Build And Publish Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "release/v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # For develop branch: latest, changelog, github run id
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=changelog,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ github.run_id }},enable=${{ github.ref == 'refs/heads/develop' }}
            # For release tags: keep a stable prod alias and also publish the specific release tag
            type=raw,value=release-vprod,enable=${{ startsWith(github.ref, 'refs/tags/release/v') }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/release/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
